---
name: Auto-merge TOC updates

on:
  pull_request:
    types: [opened]

jobs:
  enable-auto-merge-for-toc-update:
    name: Enable auto-merge for TOC file update
    if: github.event_name == 'pull_request' && github.actor == 'theforeman-bot' && github.event.pull_request.title == 'Update TOC file from downstream'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for TOC file update
        run: gh pr merge ${{ github.event.pull_request.number }} --rebase --auto --delete-branch
