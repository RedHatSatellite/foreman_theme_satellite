---
name: CI

on:
  pull_request:
  push:
    branches:
      - 'develop'
      - '*-stable'

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: Rubocop
    uses: theforeman/actions/.github/workflows/rubocop.yml@v0
    with:
      command: bundle exec rubocop --parallel --format github

  test:
    name: Ruby
    needs: rubocop
    strategy:
      fail-fast: false
      matrix:
        foreman:
          - develop
    uses: theforeman/actions/.github/workflows/foreman_plugin.yml@v0
    with:
      plugin: foreman_theme_satellite
      foreman_version: ${{ matrix.foreman }}

  enable-auto-merge-for-toc-update:
    name: Enable auto-merge for TOC file update
    if: github.event_name == 'pull_request' && github.actor == 'theforeman-bot' && github.event.pull_request.title == 'Update TOC file from downstream'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge PR
        run: gh pr merge ${{ github.event.pull_request.number }} --rebase --auto --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
